name: Deploy MOMENTO to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ma
  cancel-in-progress: false

env:
  VITE_BASE_PATH: /ma/
  VITE_SITE_URL: https://momentowatch.github.io/ma/

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Guard against wrong base path
        run: |
          set -euo pipefail
          grep -q 'src="/ma/assets/' dist/index.html \
            || { echo "::error::dist/index.html does not reference /ma/ - wrong base"; exit 1; }

      - name: Verify social metadata in build output
        run: |
          set -euo pipefail
          for needle in 'og:image' 'og:title' 'og:url' 'twitter:card' 'rel="canonical"' 'site.webmanifest'; do
            grep -q "$needle" dist/index.html || { echo "::error::missing $needle in dist/index.html"; exit 1; }
          done
          grep -q "content=\"${VITE_SITE_URL}\"" dist/index.html \
            || { echo "::error::og:url does not match VITE_SITE_URL"; exit 1; }
          if grep -q '%VITE_SITE_URL%\|%BASE_URL%' dist/index.html; then
            echo "::error::unreplaced Vite HTML constant in dist/index.html"
            exit 1
          fi
          for f in favicon.ico site.webmanifest apple-touch-icon.png og/og-image.jpg; do
            test -f "dist/$f" || { echo "::error::dist/$f missing"; exit 1; }
          done

      - name: Verify brand assets in build output
        run: node scripts/fetch-brand-assets.mjs --verify-only --dir=dist

      - name: Verify SEO files reached dist
        run: |
          set -euo pipefail
          test -f dist/robots.txt  || { echo "::error::robots.txt missing from dist"; exit 1; }
          test -f dist/sitemap.xml || { echo "::error::sitemap.xml missing from dist"; exit 1; }
          test -f dist/index.html  || { echo "::error::index.html missing from dist"; exit 1; }

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
