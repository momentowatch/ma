name: E2E — MOMENTO

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-ma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Browser tests are informational. A flaky or environment-dependent E2E
    # run must never block a dependency bump or a documentation PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund

      # Build first so a broken build fails HERE with a readable error,
      # instead of silently killing Playwright's webServer later.
      - name: Build (diagnostic)
        run: npm run build
        env:
          VITE_BASE_PATH: /ma/
          VITE_SITE_URL: https://momentowatch.github.io/ma/

      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --project=chromium
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-ma
          path: playwright-report/
          retention-days: 7
