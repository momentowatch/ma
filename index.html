    <!-- =====================================================================
         Locale bootstrap. Runs before first paint so an Arabic visitor never
         sees an LTR frame. Mirrors src/i18n/detect.ts exactly: URL override,
         then a stored choice, then the device language list, then English.
         Keep the supported-locale list and the storage key identical to
         src/i18n/config.ts. This is intentional duplication, not dead code.
         ================================================================== -->
    <script>
      (function () {
        try {
          var SUPPORTED = ['en', 'fr', 'ar'];
          var KEY = 'momento.locale';
          var primary = function (tag) {
            return String(tag || '').toLowerCase().split('-')[0].split('_')[0];
          };
          var pick = function () {
            var q = new URLSearchParams(window.location.search).get('lang');
            if (q && SUPPORTED.indexOf(primary(q)) > -1) return primary(q);
            var saved = window.localStorage.getItem(KEY);
            if (saved && SUPPORTED.indexOf(saved) > -1) return saved;
            var tags = (navigator.languages && navigator.languages.length)
              ? navigator.languages
              : [navigator.language];
            for (var i = 0; i < tags.length; i++) {
              var p = primary(tags[i]);
              if (SUPPORTED.indexOf(p) > -1) return p;
            }
            return 'en';
          };
          var locale = pick();
          var root = document.documentElement;
          root.lang = locale === 'ar' ? 'ar-MA' : locale === 'fr' ? 'fr-MA' : 'en';
          root.dir = locale === 'ar' ? 'rtl' : 'ltr';
          root.setAttribute('data-locale', locale);
        } catch (e) {
          /* never block the render on locale detection */
        }
      })();
    </script>
